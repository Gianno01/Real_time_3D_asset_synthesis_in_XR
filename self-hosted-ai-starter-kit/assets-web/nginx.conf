# Libreria XR — server web (porta 8090)
#
#   /assets/...      file della libreria, SOLA LETTURA (visori e pannello web)
#   /admin/          pannello web di gestione (file statici in ./assets-web/admin)
#   /api/library     inoltro al webhook n8n "quest-library" (stessa origine del pannello: niente problemi CORS)
#   /upload/assets/<id>/model.glb | thumb.jpg | image.png | image.jpg
#                    caricamento dei file dal pannello web verso SeaweedFS (solo POST, solo questi percorsi)

upstream seaweed { server seaweedfs:8888; }
upstream n8n_web { server n8n:5678; }

server {
    listen 80;
    client_max_body_size 1m;

    # ── Facoltativo: password per pannello, API e caricamenti ──────────
    # 1) crea il file:  docker run --rm httpd:alpine htpasswd -nbB admin LaTuaPassword > assets-web/.htpasswd
    # 2) monta il file nel servizio assets-web (vedi docker-compose.override.yml) e togli i "#" alle righe auth_basic qui sotto
    # (i visori non passano da qui per l'API: usano direttamente n8n sulla porta 5678)

    location /assets/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://seaweed;
        proxy_set_header Host $host;
        proxy_buffering on;

        # i file hanno nomi univoci (id dell'oggetto): possono restare in cache a lungo
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = / { return 302 /admin/; }
    location = /admin { return 302 /admin/; }

    location /admin/ {
        # auth_basic "Libreria XR"; auth_basic_user_file /etc/nginx/.htpasswd;
        alias /usr/share/nginx/admin/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /api/library {
        # auth_basic "Libreria XR"; auth_basic_user_file /etc/nginx/.htpasswd;
        limit_except POST { deny all; }
        client_max_body_size 4m;
        proxy_pass http://n8n_web/webhook/quest-library;
        proxy_set_header Host $host;
        proxy_read_timeout 900s;          # la reindicizzazione completa può richiedere qualche minuto
    }

    # regex tra virgolette: le graffe {8} altrimenti verrebbero lette come inizio di un blocco
    location ~ "^/upload/(assets/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(model\.glb|thumb\.jpg|image\.png|image\.jpg))$" {
        # auth_basic "Libreria XR"; auth_basic_user_file /etc/nginx/.htpasswd;
        limit_except POST { deny all; }
        client_max_body_size 300m;
        proxy_pass http://seaweed/$1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health { return 200 "ok\n"; }
    location / { return 404; }
}
