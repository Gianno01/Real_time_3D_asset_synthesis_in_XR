# Libreria XR — server web (porta 8090)
#
#   /assets/...      file della libreria, SOLA LETTURA (visori e pannello web)
#   /admin/          pannello web di gestione (file statici in ./assets-web/admin)
#   /api/library     inoltro al webhook n8n "quest-library" (stessa origine del pannello: niente problemi CORS)
#   /viewer/, /sync, /comfy/view   vista live per telefono/tablet (vedi più sotto)
#   /upload/assets/<id>/model.glb | thumb.jpg | image.png | image.jpg
#                    caricamento dei file dal pannello web verso SeaweedFS (solo POST, solo questi percorsi)

upstream seaweed { server seaweedfs:8888; }
upstream n8n_web { server n8n:5678; }

server {
    listen 80;
    client_max_body_size 1m;

    # ── Facoltativo: password per pannello, API e caricamenti ──────────
    # 1) crea il file:  docker run --rm httpd:alpine htpasswd -nbB admin LaTuaPassword > assets-web/.htpasswd
    # 2) monta il file nel servizio assets-web (vedi docker-compose.override.yml) e togli i "#" alle righe auth_basic qui sotto
    # (i visori non passano da qui per l'API: usano direttamente n8n sulla porta 5678)

    location /assets/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://seaweed;
        proxy_set_header Host $host;
        proxy_buffering on;

        # i file hanno nomi univoci (id dell'oggetto): possono restare in cache a lungo
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = / { return 302 /admin/; }
    location = /admin { return 302 /admin/; }

    location /admin/ {
        # auth_basic "Libreria XR"; auth_basic_user_file /etc/nginx/.htpasswd;
        alias /usr/share/nginx/admin/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /api/library {
        # auth_basic "Libreria XR"; auth_basic_user_file /etc/nginx/.htpasswd;
        limit_except POST { deny all; }
        client_max_body_size 4m;
        proxy_pass http://n8n_web/webhook/quest-library;
        proxy_set_header Host $host;
        proxy_read_timeout 900s;          # la reindicizzazione completa può richiedere qualche minuto
    }

    # regex tra virgolette: le graffe {8} altrimenti verrebbero lette come inizio di un blocco
    location ~ "^/upload/(assets/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(model\.glb|thumb\.jpg|image\.png|image\.jpg))$" {
        # auth_basic "Libreria XR"; auth_basic_user_file /etc/nginx/.htpasswd;
        limit_except POST { deny all; }
        client_max_body_size 300m;
        proxy_pass http://seaweed/$1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Vista live (multiplayer in sola visione) ───────────────────────
    #   /viewer/         pagina per telefono/tablet: scena del visore in tempo reale
    #   /sync            WebSocket verso il relay (servizio "sync"); il visore si collega qui con ws://<IP_PC>:8090/sync
    #   /comfy/view      sola lettura dei GLB appena generati e non ancora salvati (ComfyUI). Se ComfyUI non gira su questo PC
    #                    o usa un'altra porta, cambia l'indirizzo qui sotto.
    # "resolver" + variabile: nginx risolve i nomi al momento della richiesta, così parte anche se "sync" non c'è.
    location = /viewer { return 302 /viewer/; }
    location /viewer/ {
        alias /usr/share/nginx/viewer/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /sync {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sync_upstream http://sync:8765;
        proxy_pass $sync_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /comfy/view {
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $comfy_upstream http://host.docker.internal:8188;
        proxy_pass $comfy_upstream/view$is_args$args;
        proxy_read_timeout 120s;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /health { return 200 "ok\n"; }
    location / { return 404; }
}
